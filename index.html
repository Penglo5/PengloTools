<script>


/* -------------------------
   NAVIGATION
------------------------- */


function showAll() {

    document
        .querySelectorAll(".category")
        .forEach(section => {

            section.classList.remove("hidden");

        });


    document
        .getElementById("search")
        .value = "";


    hideTools();

}


function showCategory(category) {

    document
        .querySelectorAll(".category")
        .forEach(section => {

            section.classList.add("hidden");

        });


    const selected =
        document.getElementById(category);


    if (selected) {

        selected.classList.remove("hidden");

    }


    hideTools();

}


/* -------------------------
   SEARCH
------------------------- */


function searchItems() {

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase();


    document
        .querySelectorAll(".searchable")
        .forEach(item => {

            const text =
                item.innerText.toLowerCase();


            if (text.includes(search)) {

                item.style.display = "";

            } else {

                item.style.display = "none";

            }

        });

}


/* -------------------------
   TOOL WINDOWS
------------------------- */


function hideTools() {

    document
        .getElementById("textTool")
        .classList.add("hidden");


    document
        .getElementById("jsonTool")
        .classList.add("hidden");

}


function showTool(tool) {

    hideTools();


    if (tool === "text") {

        document
            .getElementById("textTool")
            .classList.remove("hidden");

    }


    if (tool === "json") {

        document
            .getElementById("jsonTool")
            .classList.remove("hidden");

    }

}


/* -------------------------
   TEXT TOOL
------------------------- */


function upperText() {

    const input =
        document.getElementById("textInput");


    input.value =
        input.value.toUpperCase();

}


function lowerText() {

    const input =
        document.getElementById("textInput");


    input.value =
        input.value.toLowerCase();

}


function copyText() {

    const text =
        document
            .getElementById("textInput")
            .value;


    navigator.clipboard.writeText(text);


    showToast("Text copied!");

}


/* -------------------------
   JSON FORMATTER
------------------------- */


function formatJSON() {

    const input =
        document
            .getElementById("jsonInput")
            .value;


    const output =
        document
            .getElementById("jsonOutput");


    try {

        const parsed =
            JSON.parse(input);


        output.textContent =
            JSON.stringify(
                parsed,
                null,
                4
            );

    }


    catch (error) {

        output.textContent =
            "❌ Invalid JSON:\n" +
            error.message;

    }

}


/* -------------------------
   UUID GENERATOR
------------------------- */


function generateUUID() {

    const uuid =
        crypto.randomUUID();


    navigator.clipboard.writeText(uuid);


    showToast(uuid);

}


/* -------------------------
   COLOR PICKER
------------------------- */


function updateColor() {

    const color =
        document
            .getElementById("colorPicker")
            .value;


    document
        .getElementById("colorValue")
        .textContent =
            color.toUpperCase();

}


function copyColor() {

    const color =
        document
            .getElementById("colorPicker")
            .value;


    const text =
        document.createElement("textarea");


    text.value = color;


    document
        .body
        .appendChild(text);


    text.select();


    document.execCommand("copy");


    document
        .body
        .removeChild(text);


    showToast(
        "Copied " + color + "!"
    );

}


/* -------------------------
   TOAST MESSAGE
------------------------- */


function showToast(message) {

    const toast =
        document
            .getElementById("toast");


    toast.textContent =
        message;


    toast.style.display =
        "block";


    setTimeout(() => {

        toast.style.display =
            "none";

    }, 2000);

}

</script>
